name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing to say about the commit that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.6

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

      # The 88 E2E specs are the suite that actually covers wiring, so they
      # gate the deploy rather than running after it. Only chromium is
      # configured, so only chromium is installed.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # `turbo deploy` builds first. VITE_API_URL is inlined into the bundle at
      # that point, so it belongs on this step and not on a separate build —
      # and it is declared in turbo.json's `env` so the cache keys on it.
      - run: bun run deploy
        env:
          VITE_API_URL: https://api.agentsinc.sh
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
