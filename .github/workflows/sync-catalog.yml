# Regenerates the vendored catalog from the CLI and opens a PR when it moved.
#
# The catalog is authored in another repo, so nothing that happens *here*
# signals that it changed — which is why this is triggered from outside rather
# than on merge. See docs/cli-integration.md for the emitting half.
name: Sync catalog

on:
  # What the CLI repo fires on a merge touching the generator's inputs.
  repository_dispatch:
    types: [catalog-changed]
  # So you can force a check without waiting for either of the above.
  workflow_dispatch:
  # Backstop only: catches a dropped dispatch, or a catalog edited outside CI.
  # A no-op run costs one minute, staying silently stale costs more.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

env:
  BUN_VERSION: 1.2.6
  CLI_CHECKOUT: .cli-source

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Public repo, so the default token reads it — no PAT needed on this side.
      - uses: actions/checkout@v5
        with:
          repository: claude-collective/cli
          path: ${{ env.CLI_CHECKOUT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Regenerate the vendored catalog
        working-directory: packages/matrix
        env:
          AGENTS_INC_CLI: ${{ github.workspace }}/${{ env.CLI_CHECKOUT }}
        run: bun run generate

      # Untracked paths do not appear in `git diff`, so the CLI checkout cannot
      # register as a change here. The PR step scopes what it stages anyway.
      - id: diff
        name: Did anything actually move?
        run: |
          if git diff --quiet -- packages/matrix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog is already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- packages/matrix
          fi

      # Deliberately runs here rather than on the PR: a pull request opened with
      # the default GITHUB_TOKEN does not trigger other workflows, so CI would
      # skip it. That matters because catalog.spec.ts carries a fixture guard
      # meant to fail loudly when the requirement chain is re-authored — a PR
      # that silently skipped it would defeat the one check designed for this.
      #
      # `continue-on-error` so a failure is reported in the PR body instead of
      # throwing the regenerated catalog away.
      - id: verify
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          bun run typecheck
          bun run lint
          bun run test
          bunx playwright install --with-deps chromium
          bun run test:e2e
        working-directory: ${{ github.workspace }}

      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog-sync
          # One long-lived branch: a second catalog change updates this PR
          # rather than opening a rival one.
          add-paths: packages/matrix
          commit-message: "chore: regenerate the vendored catalog"
          title: "chore: regenerate the vendored catalog"
          body: |
            Regenerated by `packages/matrix/scripts/generate-from-cli.mjs`
            from `claude-collective/cli@${{ github.event.client_payload.sha || 'main' }}`.

            **Suite: ${{ steps.verify.outcome == 'success' && 'passed ✅' || 'FAILED ❌' }}**

            A failure here usually means the requirement chain was re-authored
            upstream and `catalog.spec.ts`'s fixture guard caught it — which is
            the guard working, not the sync breaking. Read the run log before
            changing the fixture.

            Not auto-merged on purpose: a changed `requires` alters which skills
            the grid puts out of reach, and that is behaviour.
